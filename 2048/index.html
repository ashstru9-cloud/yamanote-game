<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="2048">
<title>2048 离线版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#faf8ef;color:#776e65;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
.top{width:min(92vw,420px);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:44px;color:#776e65}
.scores{display:flex;gap:6px}
.box{background:#bbada0;color:#fff;border-radius:6px;padding:6px 12px;text-align:center;min-width:64px}
.box small{display:block;font-size:11px;color:#eee4da}
.box b{font-size:20px}
.bar{width:min(92vw,420px);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px}
button{background:#8f7a66;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:15px;font-weight:bold}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:#bbada0;border-radius:8px;padding:2.5%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.5%}
.cell{background:rgba(238,228,218,.35);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(20px,8vw,40px);transition:transform .08s}
.pop{transform:scale(1.12)}
#over{position:absolute;inset:0;background:rgba(238,228,218,.75);border-radius:8px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:32px;font-weight:bold}
#over.show{display:flex}
.tip{margin-top:16px;font-size:13px;color:#a09486}
</style>
</head>
<body>
<div class="top"><h1>2048</h1><div class="scores"><div class="box"><small>分数</small><b id="s">0</b></div><div class="box"><small>最高</small><b id="b">0</b></div></div></div>
<div class="bar"><span>滑动屏幕，合成 2048</span><button id="undo">撤销</button><button id="new">新游戏</button></div>
<div id="board"><div id="over"><span id="msg">游戏结束</span><button id="again">再来一局</button></div></div>
<div class="tip">无需网络 · 进度自动保存</div>
<script>
const C={2:['#eee4da','#776e65'],4:['#ede0c8','#776e65'],8:['#f2b179','#fff'],16:['#f59563','#fff'],32:['#f67c5f','#fff'],64:['#f65e3b','#fff'],128:['#edcf72','#fff'],256:['#edcc61','#fff'],512:['#edc850','#fff'],1024:['#edc53f','#fff'],2048:['#edc22e','#fff']};
const board=document.getElementById('board'),over=document.getElementById('over');
let g,score,best=0,prev=null,won=false;const cells=[];
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';board.insertBefore(d,over);cells.push(d)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
best=+ls('b2048')||0;
function add(){const e=[];g.forEach((v,i)=>{if(!v)e.push(i)});if(!e.length)return -1;const i=e[Math.random()*e.length|0];g[i]=Math.random()<.9?2:4;return i}
function start(){g=Array(16).fill(0);score=0;won=false;prev=null;add();add();over.classList.remove('show');draw()}
function draw(pops=[]){g.forEach((v,i)=>{const c=cells[i],col=C[v]||['#3c3a32','#fff'];c.textContent=v||'';c.style.background=v?col[0]:'';c.style.color=col[1];c.style.fontSize=v>=1024?'clamp(16px,6vw,30px)':v>=128?'clamp(18px,7vw,34px)':'';c.classList.toggle('pop',pops.includes(i))});
setTimeout(()=>cells.forEach(c=>c.classList.remove('pop')),90);
document.getElementById('s').textContent=score;if(score>best){best=score;ls('b2048',best)}document.getElementById('b').textContent=best;
ls('g2048',JSON.stringify({g,score,won}))}
function line(idx){return idx.map(i=>g[i])}
function move(dir){const L=[];for(let r=0;r<4;r++){const row=[];for(let c=0;c<4;c++){row.push(dir==0?r*4+c:dir==1?r*4+3-c:dir==2?c*4+r:(3-c)*4+r)}L.push(row)}
const snap={g:g.slice(),score};let moved=false;const pops=[];
L.forEach(idx=>{let a=line(idx).filter(x=>x),out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;pops.push(idx[out.length-1]);i++}else out.push(a[i])}while(out.length<4)out.push(0);idx.forEach((p,k)=>{if(g[p]!==out[k])moved=true;g[p]=out[k]})});
if(!moved)return;prev=snap;pops.push(add());draw(pops);
if(!won&&g.includes(2048)){won=true;show('你赢了！继续玩吧')}else if(dead())show('游戏结束')}
function dead(){if(g.includes(0))return false;for(let i=0;i<16;i++){if(i%4<3&&g[i]==g[i+1])return false;if(i<12&&g[i]==g[i+4])return false}return true}
function show(t){document.getElementById('msg').textContent=t;over.classList.add('show')}
let sx,sy;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(over.classList.contains('show'))return;Math.abs(dx)>Math.abs(dy)?move(dx<0?0:1):move(dy<0?2:3)});
document.addEventListener('keydown',e=>{const k={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(k!==undefined){e.preventDefault();move(k)}});
document.getElementById('new').onclick=start;
document.getElementById('again').onclick=()=>{if(won&&!dead())over.classList.remove('show');else start()};
document.getElementById('undo').onclick=()=>{if(prev){g=prev.g;score=prev.score;prev=null;over.classList.remove('show');draw()}};
try{const s=JSON.parse(ls('g2048'));if(s&&s.g&&s.g.length==16&&s.g.some(x=>x)){g=s.g;score=s.score;won=s.won;draw();if(dead())show('游戏结束')}else start()}catch(e){start()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
